name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only: CI never publishes anything. Releases live in release.yml.
permissions:
  contents: read

# Supersede in-flight runs for the same PR; never cancel a push to main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust (fmt, clippy, test, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Derived from this repo's Cargo.lock (tauri 2.11.5 / wry 0.55.1 / tao 0.35.3),
      # not from the generic Tauri prerequisites page. Every cargo command below
      # compiles apps/autostand-app/src-tauri, so these must be installed first:
      #   webkit2gtk-sys 2.0.2       -> pkg-config "webkit2gtk-4.1"  (4.1, NOT 4.0)
      #   soup3-sys 0.5.0            -> pkg-config "libsoup-3.0"
      #   javascriptcore-rs-sys 1.1  -> pkg-config "javascriptcoregtk-4.1"
      #   gtk-sys 0.18.2             -> pkg-config "gtk+-3.0"
      #   libdbus-sys 0.2.7          -> pkg-config "dbus-1"  (tao's default `dbus` feature)
      #   libappindicator-sys 0.9.0  -> libayatana-appindicator3  (via tray-icon)
      # librsvg2-dev is required by the Tauri bundler for Linux icon rasterisation.
      # Deliberately NOT installed:
      #   libssl-dev  -- reqwest is `default-features = false` + rustls-tls, so no
      #                  crate in the graph links OpenSSL (openssl-sys is absent).
      #   libxdo-dev  -- no libxdo-sys in Cargo.lock; tao 0.35 talks to D-Bus instead.
      - name: Install Tauri v2 Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            wget \
            file \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      # --all-targets, so unit tests, integration tests and examples are linted too.
      # Lint levels come from the workspace [lints] table: rust unsafe_code = deny,
      # clippy all + pedantic + cargo = warn, promoted to errors by -D warnings.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      # cargo-audit is installed into ~/.cargo/bin, which Swatinem/rust-cache
      # restores and saves, so this is a near no-op once the cache is warm.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version '^0.22'

      # `cargo audit` exits non-zero for vulnerabilities only; `unmaintained` and
      # `unsound` advisories are reported as warnings and do not fail the build.
      # Current state of this workspace (verified with cargo-audit 0.22.2 against
      # 541 crates): 0 vulnerabilities, 17 warnings, none of them suppressed --
      #   RUSTSEC-2024-0411/0412/0413/0414/0415/0416/0417/0418/0419/0420
      #     gtk-rs GTK3 bindings unmaintained (atk, gdk, gdkx11, gtk, gtk3-macros, ...)
      #   RUSTSEC-2024-0429  glib 0.18.5 unsound VariantStrIter iterators
      #   RUSTSEC-2024-0370  proc-macro-error unmaintained
      #   RUSTSEC-2025-0075/0080/0081/0098/0100  unic-* unmaintained
      # All of them arrive through Tauri's Linux GTK3 stack or through build-time
      # proc macros; they clear when Tauri moves off GTK3. There is intentionally
      # no --ignore flag here: if a real vulnerability appears, this step fails.
      - name: cargo audit
        run: cargo audit

  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # No `version:` input on purpose: action-setup@v4 reads pnpm@11.18.0 from the
      # root package.json "packageManager" field, so CI cannot drift from the repo.
      - uses: pnpm/action-setup@v4

      # Node 22 rather than 20: root engines say node >= 20, but
      # @testing-library/jest-dom@6.10.0 (dev dep of apps/autostand-app) declares
      # engines.node ">=22", so 20 would install with an unmet-engine warning.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      # apps/autostand-app depends on @autostand/ui, which lives in the PRIVATE
      # repo MAECLY/autostand-ui and is installed straight from git. The built-in
      # GITHUB_TOKEN is scoped to THIS repository and cannot clone another one,
      # so a token with read access to autostand-ui has to be supplied as a
      # repository secret named AUTOSTAND_UI_TOKEN -- a fine-grained PAT with
      # Contents: Read on MAECLY/autostand-ui, or a GitHub App installation
      # token. This is a real new operational cost of the three-repo split; see
      # docs/dev/04-ci-cd.md. Without the secret `pnpm install` fails inside git
      # with a bare authentication error, so the step checks first and says what
      # is missing.
      #
      # The rewrite covers all three spellings on purpose: pnpm pinned the
      # dependency as `git@github.com:MAECLY/autostand-ui.git` (private repos
      # resolve over SSH, not to a codeload tarball), and a future re-resolve
      # could emit `ssh://` or `https://` instead.
      - name: Authenticate to MAECLY/autostand-ui
        env:
          AUTOSTAND_UI_TOKEN: ${{ secrets.AUTOSTAND_UI_TOKEN }}
        run: |
          if [ -z "$AUTOSTAND_UI_TOKEN" ]; then
            echo "::error::secret AUTOSTAND_UI_TOKEN is not set. @autostand/ui is a private git dependency and GITHUB_TOKEN cannot read another repository. Create a fine-grained PAT with Contents: Read on MAECLY/autostand-ui and add it as a repository secret named AUTOSTAND_UI_TOKEN."
            exit 1
          fi
          rewrite="https://x-access-token:$AUTOSTAND_UI_TOKEN@github.com/"
          # --add, not plain set: insteadOf is multi-valued and a second plain
          # `git config` would replace the first rather than append to it.
          git config --global --add url."$rewrite".insteadOf "git@github.com:"
          git config --global --add url."$rewrite".insteadOf "ssh://git@github.com/"
          git config --global --add url."$rewrite".insteadOf "https://github.com/"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # NOT `pnpm build` -- that script is `tauri build`, which needs the Rust
      # toolchain plus the GTK/WebKit stack and emits a desktop bundle; it belongs
      # in release.yml, not here. `pnpm build:web` builds only the app's Vite
      # bundle; the marketing site and Storybook build in their own repos.
      - name: Build web bundle
        run: pnpm build:web

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      # Same private-dependency problem as the frontend job; see the comment there.
      - name: Authenticate to MAECLY/autostand-ui
        env:
          AUTOSTAND_UI_TOKEN: ${{ secrets.AUTOSTAND_UI_TOKEN }}
        run: |
          if [ -z "$AUTOSTAND_UI_TOKEN" ]; then
            echo "::error::secret AUTOSTAND_UI_TOKEN is not set. @autostand/ui is a private git dependency and GITHUB_TOKEN cannot read another repository. Create a fine-grained PAT with Contents: Read on MAECLY/autostand-ui and add it as a repository secret named AUTOSTAND_UI_TOKEN."
            exit 1
          fi
          rewrite="https://x-access-token:$AUTOSTAND_UI_TOKEN@github.com/"
          # --add, not plain set: insteadOf is multi-valued and a second plain
          # `git config` would replace the first rather than append to it.
          git config --global --add url."$rewrite".insteadOf "git@github.com:"
          git config --global --add url."$rewrite".insteadOf "ssh://git@github.com/"
          git config --global --add url."$rewrite".insteadOf "https://github.com/"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Only chromium: the suite declares a single chromium project, and pulling
      # the other engines would triple the download for no extra coverage.
      - name: Install Playwright browser
        run: pnpm --filter autostand-app exec playwright install --with-deps chromium

      # Drives the real React UI against mocked Tauri IPC -- no compiled binary, so
      # this runs on a plain runner. Not a substitute for the Rust integration tests,
      # which exercise the real pipeline.
      - name: App E2E
        run: pnpm --filter autostand-app test:e2e

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: apps/autostand-app/test-results/
          retention-days: 7
          if-no-files-found: ignore

  live-e2e:
    name: Live provider × preset
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri v2 Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            wget \
            file \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Missing secrets skip that provider's 13 cells; the default PR suite
      # still passes. Set AUTOSTAND_E2E_LIVE=1 here so a configured secret
      # actually runs. Ollama stays opt-in via AUTOSTAND_E2E_OLLAMA.
      - name: Run live matrix
        env:
          AUTOSTAND_E2E_LIVE: "1"
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          XAI_API_KEY: ${{ secrets.GROK_API_KEY }}
        run: cargo test -p autostand-app --features live-e2e --test provider_preset_live -- --nocapture
