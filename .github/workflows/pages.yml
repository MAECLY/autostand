name: Pages

# Publishes both web surfaces as ONE GitHub Pages site:
#
#   https://MAECLY.github.io/autostand/             -> apps/landing (Astro)
#   https://MAECLY.github.io/autostand/storybook/   -> design-system (Storybook 8)
#
# Pages allows a single site per repository, so the two builds are assembled
# into one directory and uploaded as a single artifact. The desktop app is NOT
# part of this site; it ships as a binary from release.yml.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required by the first-party Pages flow: `pages: write` to create the
# deployment, `id-token: write` for the OIDC token deploy-pages exchanges for
# it, `contents: read` for the checkout.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. `cancel-in-progress: false` on purpose: cancelling
# a deploy that is already live-swapping would leave the site half-published,
# and these builds are short enough to just queue.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Must precede setup-node, whose `cache: pnpm` needs the pnpm binary to
      # locate the store. No `version:` — action-setup@v4 reads the pinned
      # `packageManager` field (pnpm@11.18.0) from the root package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20 # matches `engines.node: ">=20"`
          cache: pnpm

      - uses: actions/configure-pages@v5

      - run: pnpm install --frozen-lockfile

      # The landing page imports components straight out of design-system/, so
      # both builds need the whole workspace installed. Neither needs Rust.
      - name: Build landing page
        run: pnpm --filter landing build

      - name: Build Storybook
        run: pnpm --filter design-system build-storybook

      # apps/landing/astro.config.mjs already sets `base: "/autostand"`, so the
      # landing build drops straight in at the artifact root.
      #
      # Storybook needs no base configuration: @storybook/builder-vite emits a
      # fully relative bundle (`./assets/…`, and `__vitePreload` resolves its
      # dep list against each chunk's own `import.meta.url`), so the same bytes
      # work at any depth. The guard step below is what keeps that true.
      - name: Assemble site
        run: |
          rm -rf _site
          mkdir -p _site/storybook
          cp -R apps/landing/dist/. _site/
          cp -R design-system/storybook-static/. _site/storybook/
          # Belt and braces: the artifact flow does not run Jekyll, but Jekyll
          # would strip `_astro/` if Pages were ever switched back to it.
          touch _site/.nojekyll
          find _site -maxdepth 2 -not -path '*/assets/*' | sort

      # A wrong base path is the failure mode this whole workflow has: it
      # produces a page that deploys green and then 404s every asset. Fail the
      # build instead.
      - name: Verify base paths
        run: |
          for f in _site/index.html _site/storybook/index.html \
                   _site/storybook/iframe.html _site/storybook/index.json; do
            test -f "$f" || { echo "::error::missing $f"; exit 1; }
          done

          landing_refs=$(grep -oE '(href|src)="/[^"]*"' _site/index.html || true)
          [ -n "$landing_refs" ] || {
            echo "::error::landing index.html has no root-absolute refs; astro base was dropped"
            exit 1
          }
          off_base=$(printf '%s\n' "$landing_refs" | grep -v '="/autostand/' || true)
          [ -z "$off_base" ] || {
            echo "::error::landing refs outside /autostand/ (check astro.config.mjs base):"
            printf '%s\n' "$off_base"
            exit 1
          }
          for u in $(printf '%s\n' "$landing_refs" | sed -E 's/^[a-z]+="//; s/"$//'); do
            p="_site${u#/autostand}"
            test -f "$p" || {
              echo "::error::landing references $u but $p is not in the artifact"
              exit 1
            }
          done
          echo "landing: every root-absolute ref is under /autostand/ and present"

          sb_abs=$(grep -ohE '(href|src)="/[^"]*"' \
            _site/storybook/index.html _site/storybook/iframe.html || true)
          [ -z "$sb_abs" ] || {
            echo "::error::storybook emitted root-absolute URLs; they will 404 under /autostand/storybook/."
            echo "::error::set vite's base to '/autostand/storybook/' in design-system/.storybook/main.ts viteFinal."
            printf '%s\n' "$sb_abs"
            exit 1
          }
          echo "storybook: relative bundle, safe under /autostand/storybook/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
