name: Release

# Tag-driven. `git push origin v0.2.0` builds the four platform bundles and
# attaches them to a DRAFT release, which a human reviews and publishes.
# workflow_dispatch is the re-run path for a tag whose build failed halfway.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (e.g. v0.2.0)'
        required: true
        type: string

# Explicit, not inherited: tauri-action needs to create the draft release and
# upload assets, and nothing here needs any other scope.
permissions:
  contents: write

# One release per tag. Never cancel in flight — a half-uploaded draft release is
# worse than a slow one.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always

jobs:
  # Cheap gate before four expensive builds: the tag must match the version
  # committed in every manifest, or the bundles ship a version nobody asked for.
  version-check:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Manifest versions agree with the tag
        run: python3 tests/verify-version-consistency.py "$RELEASE_TAG"

  release:
    name: ${{ matrix.platform }}
    needs: version-check
    strategy:
      fail-fast: false
      matrix:
        include:
          # Two macOS legs, because Rosetta 2 only goes one way: it translates
          # x86_64 for Apple Silicon, never arm64 for Intel. An arm64 bundle does
          # not start on an Intel Mac at all, so Intel needs its own build.
          #
          # Both cross-compile on the Apple Silicon runner rather than using a
          # macos-13 Intel runner, which is being retired. Rust cross-compiles
          # from the `--target` alone; llama.cpp needs CMAKE_OSX_ARCHITECTURES,
          # which the sidecar step derives from the same target triple.
          - platform: macos-14
            target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
          - platform: macos-14
            target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04 # oldest glibc we support; do not bump casually
            target: x86_64-unknown-linux-gnu
            args: ''
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      # Tauri v2 Debian/Ubuntu prerequisites — a superset of what the Linux job
      # in ci.yml installs (compiling is not enough here: we also bundle), plus
      # patchelf, which the AppImage bundler shells out to.
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            pkg-config \
            file \
            wget \
            curl \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Registry/index only. Caching a release `target/` would push multi-GB
      # entries into the 10 GB repo cache and evict the CI caches that every PR
      # depends on; a release recompiles from scratch and that is fine.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: 'false'
          key: ${{ matrix.target }}

      # No `version:` — pnpm/action-setup reads `packageManager` from
      # package.json (pnpm@11.18.0), so the workflow cannot drift from the repo.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # Matches ci.yml, and matches reality: pnpm 11.18 refuses to run below
          # Node 22.13. The old pin of 20 followed `engines.node`, which claimed
          # a floor the repo could not actually be built on — every release leg
          # died here before compiling anything.
          node-version: "22"
          cache: pnpm

      # apps/autostand-app depends on @autostand/ui, a PRIVATE git dependency in
      # MAECLY/autostand-ui. pnpm-lock.yaml pins it over SSH, and GITHUB_TOKEN is
      # scoped to THIS repository and cannot read another one.
      #
      # The credential is a READ-ONLY DEPLOY KEY, stored as the repository secret
      # AUTOSTAND_UI_DEPLOY_KEY. Scoped to one repository, no write access, tied
      # to no person's account, revoked from that repo's Deploy keys page.
      #
      # `shell: bash` is required: the release matrix includes a Windows runner,
      # where `run:` defaults to PowerShell and none of this would parse.
      # GIT_SSH_COMMAND rather than ~/.ssh/config because it is one line, needs no
      # host-key scan, and behaves identically on all three runners.
      - name: Authenticate to MAECLY/autostand-ui
        shell: bash
        env:
          AUTOSTAND_UI_DEPLOY_KEY: ${{ secrets.AUTOSTAND_UI_DEPLOY_KEY }}
        run: |
          if [ -z "$AUTOSTAND_UI_DEPLOY_KEY" ]; then
            echo "::error::secret AUTOSTAND_UI_DEPLOY_KEY is not set. @autostand/ui is a private git dependency pinned over SSH, and GITHUB_TOKEN cannot read another repository. Add a read-only deploy key for MAECLY/autostand-ui as a repository secret named AUTOSTAND_UI_DEPLOY_KEY."
            exit 1
          fi
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$AUTOSTAND_UI_DEPLOY_KEY" > "$HOME/.ssh/autostand_ui"
          chmod 600 "$HOME/.ssh/autostand_ui"
          # accept-new trusts an unseen host once but still refuses a CHANGED key,
          # which is the property that matters. IdentitiesOnly stops a runner's
          # own agent identity being offered first and refused.
          echo "GIT_SSH_COMMAND=ssh -i $HOME/.ssh/autostand_ui -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile

      # tauri.conf.json defines no `beforeBuildCommand`, so `tauri build` will
      # not build the web assets itself — it only copies `frontendDist`
      # (../dist). Build them here or the bundle ships a stale/absent UI.
      - name: Build the frontend
        run: pnpm --filter autostand-app build

      # Built-in Local AI is shipped as two process-isolated sidecars. Build
      # Autostand's JSONL bridge for the exact release target and compile a
      # pinned llama.cpp revision as a static executable so installed bundles
      # never depend on Ollama, Homebrew, CUDA, or a system llama.cpp package.
      - name: Build built-in local AI sidecars
        shell: bash
        env:
          LLAMA_CPP_TAG: b10173
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$LLAMA_CPP_TAG" \
            https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/llama.cpp"
          # On macOS the runner is Apple Silicon for both legs, so the target
          # triple — not the host — decides the architecture. Without this the
          # Intel bundle would ship an arm64 llama-completion and the local
          # model would fail to launch on the only machines that build is for.
          osx_arch=()
          case "${{ matrix.target }}" in
            x86_64-apple-darwin)  osx_arch=(-DCMAKE_OSX_ARCHITECTURES=x86_64) ;;
            aarch64-apple-darwin) osx_arch=(-DCMAKE_OSX_ARCHITECTURES=arm64) ;;
          esac
          cmake -S "$RUNNER_TEMP/llama.cpp" -B "$RUNNER_TEMP/llama-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_CURL=OFF \
            "${osx_arch[@]}"
          # llama-completion, NOT llama-cli: tools/CMakeLists.txt only adds the
          # cli subdirectory under `if (LLAMA_BUILD_SERVER)`, which is OFF here,
          # so that target does not exist and the build fails with no project.
          # It is also the binary the sidecar prefers at runtime.
          cmake --build "$RUNNER_TEMP/llama-build" --config Release \
            --target llama-completion --parallel 2
          cargo build --release --target "${{ matrix.target }}" \
            -p autostand-local-llm

          extension=""
          if [ "${{ runner.os }}" = "Windows" ]; then extension=".exe"; fi
          binary_dir="apps/autostand-app/src-tauri/binaries"
          mkdir -p "$binary_dir"
          cp "target/${{ matrix.target }}/release/autostand-local-llm${extension}" \
            "$binary_dir/autostand-local-llm-${{ matrix.target }}${extension}"
          # The NAME is load-bearing, not cosmetic: the sidecar decides whether to
          # pass --log-disable from the binary's file stem, and llama-completion
          # writes generated tokens through that same channel. Shipping it under
          # the name llama-cli would silence the model and produce empty standups.
          llama_bin="$(find "$RUNNER_TEMP/llama-build" -type f -name "llama-completion${extension}" | head -1)"
          test -n "$llama_bin"
          cp "$llama_bin" "$binary_dir/llama-completion-${{ matrix.target }}${extension}"

      # tauri-bundler decides to codesign from the PRESENCE of APPLE_CERTIFICATE,
      # and a workflow `env:` entry for an unset secret is present-but-empty. It
      # therefore ran `security import` with an empty certificate and failed the
      # whole macOS build, rather than producing the unsigned bundle the old
      # comment here promised. Export the variables only when there is actually a
      # certificate, so an unconfigured repository builds unsigned and a
      # configured one signs without any further change.
      - name: Enable macOS codesigning when its secrets are configured
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::notice::No Apple certificate configured — building an unsigned bundle. See the README section on Gatekeeper."
            exit 0
          fi
          # Heredoc form: the certificate is multi-line base64.
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD \
                      APPLE_SIGNING_IDENTITY KEYCHAIN_PASSWORD \
                      APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name}"
            [ -n "$value" ] || continue
            printf '%s<<__AUTOSTAND_ENV__\n%s\n__AUTOSTAND_ENV__\n' "$name" "$value" \
              >> "$GITHUB_ENV"
          done
          echo "::notice::Apple certificate present — the macOS bundle will be signed."

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Windows codesigning. Passed by name only: Tauri v2 signs Windows
          # bundles from `bundle > windows > certificateThumbprint` /
          # `signCommand` in tauri.conf.json, which is not configured yet, so
          # these are reserved rather than active.
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          # The updater's own signing key, which is not code signing: it is what
          # lets an installed app prove a downloaded bundle came from this
          # repository before replacing itself with it. Independent of Developer
          # ID and Authenticode, so in-app updates work on these unsigned builds.
          # Without both of these the build fails rather than quietly shipping
          # artifacts no installed app will accept.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/autostand-app
          # Explicit: the pnpm lockfile lives at the repo root, so auto-detection
          # inside apps/autostand-app can guess the wrong package manager.
          tauriScript: pnpm tauri
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: autostand ${{ env.RELEASE_TAG }}
          releaseBody: |
            See CHANGELOG.md for what changed in this release.

            Pick the one for your machine:

            | Platform | File |
            | --- | --- |
            | macOS, Apple Silicon (M1–M4) | `_aarch64.dmg` |
            | macOS, Intel | `_x64.dmg` |
            | Windows | `-setup.exe` |
            | Linux | `.AppImage` — `chmod +x` it and run |

            The two macOS builds are not interchangeable: Rosetta 2 translates
            Intel binaries for Apple Silicon and never the reverse, so an Apple
            Silicon Mac runs either and an Intel Mac only runs `_x64`.

            From 1.2.0 onwards you only need to do this once: Settings → Advanced
            → Updates installs later versions in place. The extra `.app.tar.gz`,
            `.sig` and `latest.json` assets are what that reads — not downloads.

            **The bundles are unsigned.** macOS reports that the app *is damaged
            and can't be opened*, which means it has no Developer ID signature,
            not that the download failed. Clear the quarantine flag with:

            ```
            xattr -rd com.apple.quarantine /Applications/autostand.app
            ```

            On Windows, SmartScreen shows an unknown-publisher warning: More info
            → Run anyway. Full notes: the README section "Blocked by Gatekeeper on
            macOS?" and docs/user/01-install.md
          releaseDraft: true
          prerelease: false
          # Publishes latest.json alongside the installers. It is the feed
          # `plugins.updater.endpoints` points at, so a release without it leaves
          # every installed copy reporting "no newer version published".
          includeUpdaterJson: true
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json
