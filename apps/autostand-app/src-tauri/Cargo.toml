[package]
name = "autostand-app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "autostand Tauri v2 desktop app"
readme = "README.md"
keywords = ["standup", "tauri", "desktop", "automation", "productivity"]
categories = ["office-automation", "gui"]
default-run = "autostand-app"

[lib]
name = "autostand_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
autostand-core = { workspace = true }
autostand-adapters = { workspace = true }
autostand-scheduler = { workspace = true }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
keyring = { workspace = true }

[dev-dependencies]
tempfile = "3"

[features]
custom-protocol = ["tauri/custom-protocol"]
# Compiles `tests/provider_preset_live.rs`. The test itself also requires
# `AUTOSTAND_E2E_LIVE=1` and skips any provider whose API key is missing.
live-e2e = []
